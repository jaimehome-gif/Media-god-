name: Media God Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Media God regression gate
        run: npm run test:regression

      - name: Check public Live TV and UK EPG
        continue-on-error: true
        run: npm run test:network

  auth_bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify production API syntax
        run: |
          node --check deploy/media-god-identity-api/server.mjs
          node --check deploy/media-god-identity-api/base44Bridge.mjs
          node --check deploy/media-god-identity-api/base44Recovery.mjs
          node --check src/api/legacyBase44Bridge.js
      - name: Verify Base44 account bridge security
        run: node --test tests/base44-account-bridge.test.mjs tests/base44-recovery.test.mjs tests/base44-addon-import.test.mjs
      - name: Verify native Sources VLC handoff
        run: node --test tests/native-vlc-source-priority.test.mjs tests/tv-sources-native-vlc-handoff.test.mjs
      - name: Verify Continue Watching resumes in the native Media God player
        run: node --test tests/continue-watching-native-resume.test.mjs tests/firetv-resume-routing.test.mjs tests/continue-watching-source-recovery.test.mjs tests/continue-watching-in-player-sources.test.mjs
      - name: Verify OnlyFlix primary Play and Media God Sources Play
        run: node --test tests/sources-play-mediagod-main-onlyflix.test.mjs tests/tv-sources-native-vlc-handoff.test.mjs tests/native-vlc-source-priority.test.mjs tests/continue-watching-native-resume.test.mjs
      - name: Verify website sound recovery without changing normal Play or TV
        run: node --test tests/website-audio-recovery.test.mjs tests/browser-hls-audio-priority.test.mjs tests/sources-play-mediagod-main-onlyflix.test.mjs
      - name: Compile independent website
        run: npm run build
      - name: Verify identity service container build
        run: docker build -t media-god-identity-bridge deploy/media-god-identity-api
