apply plugin: 'com.android.application'

android {
    namespace "com.streamvibe.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.streamvibe.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Release signing configuration.
    //
    // Provide a real keystore via android/keystore.properties for Play Store /
    // Appstore distribution:
    //   storeFile=release.keystore
    //   storePassword=...
    //   keyAlias=...
    //   keyPassword=...
    //
    // In CI you can instead set the STREAMVIBE_KEYSTORE_FILE / _PASSWORD /
    // _ALIAS / _KEY_PASSWORD environment variables. When neither is present the
    // release build falls back to the debug signing key, so a release APK is
    // always produced and installable for local testing.
    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                props.load(new FileInputStream(propsFile))
            }
            if (props.containsKey('storeFile')) {
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            } else if (System.env.STREAMVIBE_KEYSTORE_FILE) {
                storeFile file(System.env.STREAMVIBE_KEYSTORE_FILE)
                storePassword System.env.STREAMVIBE_KEYSTORE_PASSWORD
                keyAlias System.env.STREAMVIBE_KEY_ALIAS
                keyPassword System.env.STREAMVIBE_KEY_PASSWORD
            } else {
                // No release keystore configured — reuse the debug key so the
                // release APK is still signed and installable for testing.
                storeFile signingConfigs.debug.storeFile
                storePassword signingConfigs.debug.storePassword
                keyAlias signingConfigs.debug.keyAlias
                keyPassword signingConfigs.debug.keyPassword
            }
        }
    }

    // Two build flavors: a touch-first phone/tablet build and a D-pad/remote
    // Fire TV / Fire Stick build. Source sets live in src/phone and src/firetv.
    flavorDimensions = ['device']
    productFlavors {
        phone {
            dimension "device"
            // Standard phone/tablet — full touch, any orientation.
        }
        firetv {
            dimension "device"
            // Amazon Fire TV / Fire Stick — D-pad/remote, landscape, leanback.
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
