<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media God personal media</title>
<style>body{font:15px system-ui,sans-serif;background:#101010;color:#fff;margin:12px}input,button{max-width:100%;color:#fff;background:#272727;border:1px solid #555;border-radius:8px;padding:10px}movi-player{display:block;width:100%;aspect-ratio:16/9;background:#000;margin-top:10px}#status{overflow-wrap:anywhere}.mg-web-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;background:#161616;border:1px solid #444;border-radius:8px}.mg-web-controls button,.mg-web-controls select{font:inherit;color:white;background:#252525;border:1px solid #555;border-radius:6px;padding:10px;min-height:42px}.mg-web-controls button:focus-visible,.mg-web-controls input:focus-visible,.mg-web-controls select:focus-visible{outline:2px solid #75f28b}.mg-web-controls input[type=range]{flex:1 1 140px;accent-color:#75f28b}.mg-web-controls button:disabled{opacity:.45}#stage:fullscreen{background:black;display:flex;flex-direction:column;justify-content:center}#stage:fullscreen movi-player{min-height:0;flex:1;aspect-ratio:auto}</style>
</head>
<body>
<h2>Play a personal video</h2>
<p>Select a video file from your device, then press Play. The file stays in your browser.</p>
<label for="file">Choose video</label>
<input id="file" type="file" accept="video/*,.mkv,.mp4,.m4v,.webm,.mov,.avi,.ts,.m2ts" disabled>
<button id="close" type="button" disabled>Clear video</button>
<p id="status" role="status">Loading Movi…</p><div id="stage"></div>
<script type="module" src="./personal.js"></script>
</body></html>
