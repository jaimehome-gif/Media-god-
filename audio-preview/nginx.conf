server {
 listen 8080;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Robots-Tag "noindex, nofollow" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
 location / { try_files $uri $uri/ =404; }
 location /media/ {
  types { video/mp4 mp4; video/webm webm; application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
  try_files $uri =404;
 }
}
