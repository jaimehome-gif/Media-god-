server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Public, synthetic test assets only; allow an opaque-origin sandbox to read them.
  location ^~ /decoder-lab/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri =404;
  }
  location ^~ /source-player/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Document-Isolation-Policy "isolate-and-credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    try_files $uri =404;
  }
  location / {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
  }
  location ~* \.(?:js|css|png|jpe?g|gif|svg|woff2?|ico)$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
  location = /index.html {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store";
  }
}
